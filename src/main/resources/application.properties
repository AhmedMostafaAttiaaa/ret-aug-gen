spring.application.name=rag-gemini
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# LLM provider: gemini | openai | ollama | anthropic
llm.provider=${LLM_PROVIDER:gemini}

# Gemini
gemini.api-key=${GEMINI_API_KEY:}
gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-1.5-flash}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}

# OpenAI (or any OpenAI-compatible endpoint)
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:}
openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# Ollama (local models, no API key needed)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.1}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Anthropic Claude (embeddings run locally via all-MiniLM-L6-v2, no embeddings API from Anthropic)
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.chat-model=${ANTHROPIC_CHAT_MODEL:claude-sonnet-4-5}
